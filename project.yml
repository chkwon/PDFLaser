name: PDFLaser
options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_MODULE_NAME: PDFLaser
    MARKETING_VERSION: 0.1.6
    CURRENT_PROJECT_VERSION: 6
targets:
  PDFLaser-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PDFLaser/Shared
      - path: PDFLaser/macOS
    info:
      path: PDFLaser/macOS/Info.plist
      properties:
        CFBundleDisplayName: PDF Laser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_NAME: PDF Laser
        PRODUCT_BUNDLE_IDENTIFIER: com.chkwon.PDFLaser.macOS
        CODE_SIGN_ENTITLEMENTS: PDFLaser/macOS/PDFLaser-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          DEVELOPMENT_TEAM: 6CM5MD58K2
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: --timestamp
  PDFLaser-iPadOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PDFLaser/Shared
      - path: PDFLaser/iPadOS
    info:
      path: PDFLaser/iPadOS/Info.plist
      properties:
        CFBundleDisplayName: PDF Laser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: PDF Laser
        PRODUCT_BUNDLE_IDENTIFIER: com.chkwon.PDFLaser.iPadOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 2
  PDFLaserTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PDFLaser/Tests
    dependencies:
      - target: PDFLaser-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chkwon.PDFLaserTests
        PRODUCT_MODULE_NAME: PDFLaserTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PDF Laser.app/Contents/MacOS/PDF Laser"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PDFLaser-macOS:
    build:
      targets:
        PDFLaser-macOS: all
    test:
      targets:
        - PDFLaserTests
  PDFLaser-iPadOS:
    build:
      targets:
        PDFLaser-iPadOS: all
