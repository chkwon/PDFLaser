name: macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag
        required: true
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: PDF Laser
  SCHEME: PDFLaser-macOS
  PROJECT: PDFLaser.xcodeproj
  TEAM_ID: 6CM5MD58K2

jobs:
  build-sign-notarize:
    name: Build, sign, notarize
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must look like v1.2.3, got: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short_version=${VERSION#v}" >> "${GITHUB_OUTPUT}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer_id_application.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"

          echo "${CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

      - name: Write notarization API key
        id: notary-key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          PRIVATE_KEYS_DIR="${RUNNER_TEMP}/private_keys"
          KEY_PATH="${PRIVATE_KEYS_DIR}/AuthKey_${ASC_KEY_ID}.p8"

          mkdir -p "${PRIVATE_KEYS_DIR}"
          printf "%s" "${ASC_PRIVATE_KEY}" > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"

          echo "key_path=${KEY_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build signed Release app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            MARKETING_VERSION="${{ steps.release.outputs.short_version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            clean build

      - name: Verify signature and architecture
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/Release/${APP_NAME}.app"
          EXECUTABLE_PATH="${APP_PATH}/Contents/MacOS/${APP_NAME}"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign -dv --verbose=4 "${APP_PATH}"
          lipo -info "${EXECUTABLE_PATH}"

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/Release/${APP_NAME}.app"
          NOTARY_ZIP="${RUNNER_TEMP}/PDF-Laser-${{ steps.release.outputs.version }}-notary.zip"

          COPYFILE_DISABLE=1 ditto -c -k --keepParent "${APP_PATH}" "${NOTARY_ZIP}"

          xcrun notarytool submit "${NOTARY_ZIP}" \
            --key "${{ steps.notary-key.outputs.key_path }}" \
            --key-id "${ASC_KEY_ID}" \
            --issuer "${ASC_ISSUER_ID}" \
            --wait

          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"
          spctl --assess --type execute --verbose=4 "${APP_PATH}"

      - name: Package release zip
        id: package
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/Release/${APP_NAME}.app"
          ZIP_PATH="${RUNNER_TEMP}/PDF-Laser-${{ steps.release.outputs.version }}-macOS-universal.zip"

          COPYFILE_DISABLE=1 ditto -c -k --keepParent "${APP_PATH}" "${ZIP_PATH}"
          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Laser-${{ steps.release.outputs.version }}-macOS-universal
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${ZIP_PATH}" --clobber
          else
            gh release create "${VERSION}" "${ZIP_PATH}" \
              --title "PDF Laser ${VERSION}" \
              --generate-notes
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: chkwon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Homebrew tap binary release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.short_version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          TAP_TAG="pdflaser-v${VERSION}"

          if gh release view "${TAP_TAG}" --repo chkwon/homebrew-tap >/dev/null 2>&1; then
            gh release upload "${TAP_TAG}" "${ZIP_PATH}" --repo chkwon/homebrew-tap --clobber
          else
            gh release create "${TAP_TAG}" "${ZIP_PATH}" \
              --repo chkwon/homebrew-tap \
              --title "PDF Laser v${VERSION}" \
              --notes "Signed and notarized macOS universal app for Homebrew Cask installation."
          fi

      - name: Update Homebrew cask
        env:
          VERSION: ${{ steps.release.outputs.short_version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          SHA256="$(shasum -a 256 "${ZIP_PATH}" | awk '{print $1}')"
          CASK_PATH="homebrew-tap/Casks/pdflaser.rb"

          mkdir -p "$(dirname "${CASK_PATH}")"
          cat > "${CASK_PATH}" <<EOF
          cask "pdflaser" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/chkwon/homebrew-tap/releases/download/pdflaser-v#{version}/PDF-Laser-v#{version}-macOS-universal.zip"
            name "PDF Laser"
            desc "PDF slide presenter with laser pointer and pen markup"
            homepage "https://github.com/chkwon/PDFLaser"

            livecheck do
              url "https://github.com/chkwon/homebrew-tap/releases/latest"
              strategy :github_latest
              regex(/pdflaser[._-]v?(\d+(?:\.\d+)+)/i)
            end

            depends_on macos: ">= :sonoma"

            app "PDF Laser.app"

            zap trash: [
              "~/Library/Preferences/com.chkwon.PDFLaser.macOS.plist",
              "~/Library/Saved Application State/com.chkwon.PDFLaser.macOS.savedState",
            ]
          end
          EOF

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C homebrew-tap diff --quiet -- "${CASK_PATH#homebrew-tap/}"; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git -C homebrew-tap add "${CASK_PATH#homebrew-tap/}"
          git -C homebrew-tap commit -m "Update PDF Laser to v${VERSION}"
          git -C homebrew-tap push
